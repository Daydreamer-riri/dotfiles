[custom]
;不要随意改变关键字，否则会导致出错
;自定义规则 - 使用 ruleset 驱动规则生成器

; =========================
; 规则集定义（目标分组 → 规则源）
; =========================
; 直连与基础
ruleset=➡️ 直接连接,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.list
ruleset=➡️ 直接连接,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list

ruleset=🎞️ PikPak,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PikPak/PikPak.list

ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; AI 服务
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/Daydreamer-riri/dotfiles/refs/heads/main/Claude.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Anthropic/Anthropic.list
; ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list

; 国际流媒体与国际网站
ruleset=🎬 国际流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list
ruleset=🌐 国际网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list

; 亚洲/大陆相关媒体与网站
ruleset=🎬 大陆流媒体国际版,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AsianMedia/AsianMedia.list
ruleset=🎬 大陆流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.list
ruleset=🏠 大陆网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list

; 游戏平台
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/Game.list

; 中国 IP 段与漏网之鱼
ruleset=🏠 大陆流量,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaIPs/ChinaIPs.list
ruleset=🏠 大陆流量,[]GEOIP,CN
ruleset=🚥 其他流量,[]FINAL

; =========================
; 分组定义（订阅节点通过 .* 自动填充）
; =========================
custom_proxy_group=🌐 国外流量`select`[]♻️ 自动选择`[]♻️ 低倍率`[]➡️ 直接连接`.*

custom_proxy_group=🎬 国际流媒体`select`[]🌐 国外流量`[]➡️ 直接连接`(流媒体)

custom_proxy_group=🤖 AI服务`select`.*
custom_proxy_group=🎮 游戏平台`select`[]🌐 国外流量`[]➡️ 直接连接`.*

custom_proxy_group=🌐 国际网站`select`[]🌐 国外流量`[]➡️ 直接连接`.*
custom_proxy_group=🏠 大陆流量`select`[]➡️ 直接连接`[]🌐 国外流量`.*
custom_proxy_group=🎬 大陆流媒体`select`[]🏠 大陆流量`[]➡️ 直接连接`.*
custom_proxy_group=🎬 大陆流媒体国际版`select`[]➡️ 直接连接`[]🌐 国外流量`.*

custom_proxy_group=🎞️ PikPak`select`[]🏠 大陆流量`[]➡️ 直接连接`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=♻️ 低倍率`url-test`(0.5|0.8)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🏠 大陆网站`select`[]🏠 大陆流量`[]➡️ 直接连接`.*
custom_proxy_group=➡️ 直接连接`select`[]DIRECT
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🚥 其他流量`select`[]🌐 国外流量`[]➡️ 直接连接`.*

; =========================
; 规则生成器开关
; =========================
enable_rule_generator=true
overwrite_original_rules=true
